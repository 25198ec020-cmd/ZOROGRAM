<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROFILE.PAGR ZOROGRAM</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    
    body{
      background-color: whitesmoke;
    }
    
    a{
      text-decoration: none;
      color: blue;
    }
    
    header{
      display: flex;
      flex-direction: column;
      padding: 10px;
      background-color: white;
      gap: 10px;
      
    }
    
  .sub_head{
    display: flex;
    align-items: center;
    justify-content: space-around;
  }
  
  .full_page{
    display: flex;
    flex-direction: column;
    margin: 10px;
    padding: 10px;
    background-color: white;
    gap: 15px;
    border-radius: 10px;
  }
  
  .profile{
    display: flex;
    gap: 10px;
  }
  
    
    .profile_pic{
      border: 1px solid;
      padding: 10px;
      width: 100px;
      height: 100px;
      border-radius: 3em;
    }
    
    .bio{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .influence{
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    
    .sub_influence{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    
    .full_page2{
      display: flex;
      align-items: center;
      justify-content: space-around;
      border: 2px solid;
      padding: 5px;
      margin: 10px;
      border-color: white;
      background-color: white;
    }
    
    .full_page3{
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      margin: 10px;
      background-color: white;
      border-radius: 10px;
    }
    
    .post_profile_pic{
      border: 1px solid;
      width: 50px;
      height: 50px;
      border-radius: 2em;
    }
    
    .post_profile{
      display: flex;
      align-items: center;
      gap: 10px;
      
    }
    
    .post_content{
      display: flex;
      flex-direction: column;
    }
    
    .buttons{
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .button{
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    button{
      border: 2px solid white;
      background-color: white;
      font-size: 1em;
    }
    
    button:hover{
      border-bottom-color: purple;
      color: purple;
      
    }
    
  </style>
</head>

<body>
  
  <header>
    <h1>ZOROGRAM</h1>
    <div class="sub_head">
      <a href="home.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="Create_post.html">Create</a>
      <a href="search_page.html">Search</a>
      <a href="">Logout </a>
    </div>
  </header>
  
  <main>
    <section>
      <article>
        <div class="full_page">
          <div class="profile">
            <div class="profile_pic"></div>
            <div class="bio">
              <h2 id="username"></h2>
              <h5 id="handle"></h5>
              <p id="bio">I like animes</p>
            </div>
          </div>
          
          <div class="influence">
            
            <div class="sub_influence">
              <h2 id="post_count"></h2>
              <p>Posts</p>
            </div>
            <div class="sub_influence">
              <h2 id="followers_count">0</h2>
              <p>Followers</p>
            </div>
            <div class="sub_influence">
              <h2 id="following_count">0</h2>
              <p>Following</p>
            </div>
            
          </div>
          
        
        </div>
      </article>
      
      <article>
        <div class="full_page2">
          <button>Posts</button>
          <button>Likes</button>
          <button>Saved</button>
        </div>
      </article>
      
    </section>
      
      <article id="user_posts">
 
      </article>
      
    
  </main>
  
  <script src="profile.js"></script>

</body>
</html>
